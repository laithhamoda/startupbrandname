packages:
  - apps/*
  - packages/*

# No dependency needs its install script. Hooks are installed by the root `prepare` script, and
# unrs-resolver's script only builds a fallback binary for platforms without a prebuilt one.
ignoredBuiltDependencies:
  - lefthook
  - unrs-resolver

# Versions published less than 3 days ago (in minutes) are not picked when resolving, so a
# compromised release is usually pulled before it can land here (D-142). Installs from the lockfile
# are unaffected. An urgent fix goes in `minimumReleaseAgeExclude` until it is 3 days old.
minimumReleaseAge: 4320
