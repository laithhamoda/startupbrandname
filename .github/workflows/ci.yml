name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Placeholders that satisfy the env schema at build time. CI never talks to a hosted Supabase.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Scan client bundle for secrets
        run: pnpm check:bundle

  e2e-smoke:
    name: E2E, accessibility and RTL snapshots (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned Playwright image (Ubuntu 26.04, same as the WSL dev environment) so snapshots are
    # rendered identically on every run (D-055). Keep the tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute@sha256:b022639ae9197f864040f92eef7b57c6d4b47db2190f77c909d8a5d902dd4b7e
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sbn/web run build
      - run: pnpm --filter @sbn/web exec playwright test --project=site
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-auth:
    name: E2E sign-in flows (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No screenshots here, so the host runner's Chromium is fine; the local Supabase stack needs
    # the host's Docker, which the pinned Playwright container does not have.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # CLI version is read from the root lockfile.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database, auth, API and Mailpit only)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - name: Database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code apps/web/src/lib/supabase/database.types.ts
      # The local stack's well-known development keys, not secrets.
      - name: Read the local Supabase URL and keys
        id: local
        run: |
          supabase status -o env > /tmp/supabase.env
          value() { grep "^$1=" /tmp/supabase.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "api-url=$(value API_URL)"
            echo "publishable-key=$(value PUBLISHABLE_KEY)"
            echo "mailpit-url=$(value MAILPIT_URL)"
          } >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @sbn/web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.local.outputs.api-url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.local.outputs.publishable-key }}
      - run: pnpm --filter @sbn/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sbn/web exec playwright test --project=auth
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.local.outputs.api-url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.local.outputs.publishable-key }}
          MAILPIT_URL: ${{ steps.local.outputs.mailpit-url }}
          # Shows the Google button so the hand-over test can press it; the local stack has
          # Google off, and the test only checks the request sent to Supabase.
          AUTH_GOOGLE_ENABLED: 'true'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-auth
          path: apps/web/playwright-report
          retention-days: 7

  db:
    name: Migrations and RLS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CLI version is read from the root lockfile.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase test db

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI rather than gitleaks-action: the action scans only the pushed commit
      # range and fails on a repository's first push (the root commit has no parent).
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
