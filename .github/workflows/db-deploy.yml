name: DB deploy

# Staging: automatic when migrations change on main.
# Production: manual run only; the `production` GitHub Environment requires approval.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to migrate
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations to ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD are environment-scoped secrets.
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --yes
