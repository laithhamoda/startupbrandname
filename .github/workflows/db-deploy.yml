name: DB deploy

# Staging: automatic when migrations change on main.
# Production: manual run only, with the typed confirmation "migrate production" (D-047).
# The `db-` prefix keeps these apart from the `Production`/`Preview` environments Vercel creates.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to migrate
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: 'Production only: type "migrate production" to confirm'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations to ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD are environment-scoped secrets.
    environment: db-${{ github.event_name == 'push' && 'staging' || inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      # Required reviewers are unavailable for private repos below GitHub Enterprise (D-047),
      # so production needs a typed confirmation instead.
      - name: Require typed confirmation for production
        if: inputs.target == 'production' && inputs.confirm != 'migrate production'
        run: |
          echo '::error::To migrate the production database, run again and type "migrate production" in the confirm field.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # The Supavisor pooler sometimes rejects the correct password (SQLSTATE 28P01) and a re-run
      # succeeds (D-088). Retry only a failure to connect, and only if the CLI never reached the
      # push prompt: it writes nothing to the database before that line.
      - name: Push migrations (retry if the connection fails)
        shell: bash # adds -o pipefail; the default shell would let `tee` hide a failed push
        env:
          ATTEMPTS: 3
          RETRY_DELAY_SECONDS: 30
        run: |
          log="$(mktemp)"
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if supabase db push --yes 2>&1 | tee "$log"; then
              exit 0
            fi
            if grep -Fq -e 'Do you want to push these migrations' -e 'Applying migration' "$log"; then
              echo '::error::db push failed after reaching the migrations; not retrying.'
              exit 1
            fi
            if ! grep -Fq -e 'SQLSTATE 28P01' -e 'failed to connect' "$log"; then
              echo '::error::db push failed for a reason other than connecting; not retrying.'
              exit 1
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "::warning::Could not connect to the database (attempt $attempt of $ATTEMPTS); retrying in ${RETRY_DELAY_SECONDS}s."
              sleep "$RETRY_DELAY_SECONDS"
            fi
          done
          echo "::error::Could not connect to the database after $ATTEMPTS attempts."
          exit 1
